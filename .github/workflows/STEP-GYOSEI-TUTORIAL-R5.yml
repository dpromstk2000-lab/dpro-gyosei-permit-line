name: DPRO GYOSEI Batch09 Tutorial R5 Manuals LIVE Build QA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-gyosei-tutorial-r5-manuals
  cancel-in-progress: false

jobs:
  r5-manuals:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock R4 CENTRAL accepted baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="374b41ed7f46fa371db0d82ad20fa941db8e4f83"
          git merge-base --is-ancestor "$BASELINE" HEAD
          echo "R5_SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R5_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "R4_ACCEPTED_HEAD=$BASELINE" >> "$GITHUB_ENV"

          test -f tutorial.html
          test -f demo-guide.html
          grep -F 'GYOSEI-TUTORIAL-R3-V1.1-20260829' tutorial.html
          grep -F 'GYOSEI-TUTORIAL-R4-MODE-BRIDGE-V1.0-20260829' tutorial.html
          grep -F 'GYOSEI-GUIDE-R4-V1.0-20260829' demo-guide.html

          python - <<'PY'
          import re
          t=open('tutorial.html',encoding='utf-8').read()
          g=open('demo-guide.html',encoding='utf-8').read()
          tids=re.findall(r'id:"(GYOSEI-\d{2})"',t)
          gids=re.findall(r'"id":"(GYOSEI-\d{2})"',g)
          assert tids==[f'GYOSEI-{i:02d}' for i in range(1,11)],tids
          assert gids==[f'GYOSEI-{i:02d}' for i in range(1,11)],gids
          assert 'dpro_tutorial_gyosei_v1' in t and 'dpro_tutorial_gyosei_v1' in g
          print('FIRST10_COUNT=10')
          print('GUIDE_COUNT=10')
          print('R4_BASELINE_LOCK=PASS')
          PY

      - name: Install R5 build and QA tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install reportlab pillow pymupdf opencv-python-headless qrcode playwright
          python -m playwright install --with-deps chromium

      - name: Wait for accepted public R4
        shell: bash
        run: |
          set -euo pipefail
          URL1="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html"
          URL2="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/demo-guide.html"
          f1="$(mktemp)"; f2="$(mktemp)"
          trap 'rm -f "$f1" "$f2"' EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 12 -o "$f1" "$URL1?r5=$GITHUB_SHA-$i" \
              && curl -fsSL --max-time 12 -o "$f2" "$URL2?r5=$GITHUB_SHA-$i" \
              && grep -Fq 'GYOSEI-TUTORIAL-R3-V1.1-20260829' "$f1" \
              && grep -Fq 'GYOSEI-GUIDE-R4-V1.0-20260829' "$f2"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Capture LIVE screenshots and build A4 manuals
        shell: bash
        env:
          SOURCE_HEAD: ${{ env.R5_SOURCE_HEAD }}
          SOURCE_TREE: ${{ env.R5_SOURCE_TREE }}
        run: |
          set -euo pipefail
          mkdir -p manuals
          cat > "$RUNNER_TEMP/gyosei_r5.py" <<'PY'
          import os, re, json, hashlib, shutil, math, textwrap
          from pathlib import Path

          import fitz
          import cv2
          import numpy as np
          from PIL import Image, ImageStat
          import qrcode

          from playwright.sync_api import sync_playwright
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.lib.utils import ImageReader

          BASE='https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/'
          TUTORIAL=BASE+'tutorial.html'
          GUIDE=BASE+'demo-guide.html'
          START=TUTORIAL+'?mode=start'
          RESUME=TUTORIAL+'?mode=resume'
          REPLAY=TUTORIAL+'?mode=replay'
          VERSION='GYOSEI-TUTORIAL-R3-V1.1-20260829'
          GUIDE_VERSION='GYOSEI-GUIDE-R4-V1.0-20260829'
          SOURCE_HEAD=os.environ['SOURCE_HEAD']
          SOURCE_TREE=os.environ['SOURCE_TREE']

          OUT=Path('manuals')
          SCREENS=OUT/'screens'
          RENDER=OUT/'rendered'
          QUICK_RENDER=RENDER/'quick'
          DETAIL_RENDER=RENDER/'detail'
          for p in [SCREENS,QUICK_RENDER,DETAIL_RENDER]:
              p.mkdir(parents=True,exist_ok=True)

          quick_pdf=OUT/'DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf'
          detail_pdf=OUT/'DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf'
          quick_preview=OUT/'DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.png'
          detail_preview=OUT/'DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.png'

          steps=[
            ('GYOSEI-01','公開デモの入口を確認','demo-guide.html','#primaryDemoLink','.hero-actions .button-ghost','公開デモの入口とFirst10開始導線を確認します。'),
            ('GYOSEI-02','相談分野を選ぶ','index.html?demo=1','#categoryGrid .category','#categoryGrid','相談分野を選ぶ位置だけを確認します。送信はしません。'),
            ('GYOSEI-03','相談受付の流れを進める','index.html?demo=1',".step[data-step='1'] [data-next]",'#consultForm .step.active .btn-primary','受付フローの次へ導線を確認します。最終送信は対象外です。'),
            ('GYOSEI-04','依頼者マイページの状況を確認','member.html?demo=1','#openCaseCount','.summary','進行中案件・必要書類・面談・期限のサマリーを確認します。'),
            ('GYOSEI-05','進行中案件を見る','member.html?demo=1','#caseGrid','.section .case-grid','進行中案件のカード領域を確認します。変更依頼は実行しません。'),
            ('GYOSEI-06','スタッフiPadへ入る','owner-ipad.html?demo=1','#adminCode','#loginForm','デモ管理コード入口を確認します。自動認証済み時は安全に表示済み領域へ復帰します。'),
            ('GYOSEI-07','iPad画面を開く','owner-ipad.html?demo=1','#loginForm .btn-primary','#adminCode','iPad画面を開く導線を確認します。保存・更新は実行しません。'),
            ('GYOSEI-08','本日・検索・書類・タスクの入口を確認','owner-ipad.html?demo=1','nav.tabs','#gate','5つの主要入口を確認します。書類・タスク・案件更新は対象外です。'),
            ('GYOSEI-09','管理PCを開く','owner.html?demo=1','#pageTitle','#adminCodeInput','管理PCのダッシュボード入口を確認します。'),
            ('GYOSEI-10','期限・更新管理への導線を確認','owner.html?demo=1',"button.summary-card[data-jump='deadlines']",'#pageTitle','期限・更新管理への入口を確認し、First10を完了します。'),
          ]

          # ---- LIVE capture: Guide Center + Tutorial card only. No real client/case data is retained.
          unsafe=[]
          page_errors=[]
          console_errors=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              ctx=browser.new_context(viewport={'width':1440,'height':1000})
              page=ctx.new_page()
              page.on('request',lambda r: unsafe.append({'method':r.method,'url':r.url}) if r.method not in ('GET','HEAD','OPTIONS') else None)
              page.on('pageerror',lambda e: page_errors.append(str(e)))
              page.on('console',lambda m: console_errors.append(m.text) if m.type=='error' else None)

              page.goto(GUIDE+'?r5capture='+SOURCE_HEAD,wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("v=>window.__DPRO_GUIDE__?.version===v",GUIDE_VERSION,timeout=20000)
              page.screenshot(path=str(SCREENS/'guide-center-live.png'),full_page=False)

              page.goto(REPLAY+'&r5capture='+SOURCE_HEAD,wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("v=>window.__DPRO_TUTORIAL__?.version===v",VERSION,timeout=20000)
              page.wait_for_function("()=>window.__DPRO_TUTORIAL__?.getState?.().status==='active'",timeout=20000)

              for i,(sid,*_) in enumerate(steps):
                  page.wait_for_function("""i=>{
                    const t=window.__DPRO_TUTORIAL__,s=t?.getState?.(),r=t?.getTargetState?.();
                    return s?.status==='active'&&s.index===i&&r?.resolved===true&&r.stepId===t.steps[i].id;
                  }""",i,timeout=25000)
                  assert page.locator('#tutorialCard').is_visible()
                  page.locator('#tutorialCard').screenshot(path=str(SCREENS/f'{sid}.png'))
                  if i<9:
                      page.evaluate("()=>window.__DPRO_TUTORIAL__.next()")

              browser.close()

          assert not unsafe,unsafe
          assert not page_errors,page_errors
          # Browser may emit unrelated favicon/network console noise; retain only tutorial/guide script errors.
          attributable=[x for x in console_errors if 'tutorial' in x.lower() or 'guide' in x.lower()]
          assert not attributable,attributable

          # ---- Japanese font
          font_candidates=[
              '/usr/share/fonts/opentype/ipafont-gothic/ipag.ttf',
              '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
              '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
          ]
          font_path=next((p for p in font_candidates if Path(p).exists()),None)
          assert font_path,font_candidates
          pdfmetrics.registerFont(TTFont('JP',font_path))

          W,H=A4
          NAVY=(23/255,50/255,77/255)
          TEAL=(36/255,123/255,120/255)
          MUTED=(90/255,105/255,114/255)
          PALE=(238/255,248/255,246/255)
          LINE=(218/255,226/255,228/255)
          WARM=(1.0,245/255,229/255)

          def wrap(c,text,font='JP',size=9,maxw=480):
              out=[]; cur=''
              for ch in text:
                  test=cur+ch
                  if pdfmetrics.stringWidth(test,font,size)<=maxw:
                      cur=test
                  else:
                      if cur: out.append(cur)
                      cur=ch
              if cur: out.append(cur)
              return out

          def draw_text(c,text,x,y,size=9,maxw=480,leading=None,color=(0,0,0),max_lines=None):
              c.setFont('JP',size); c.setFillColorRGB(*color)
              lines=wrap(c,text,'JP',size,maxw)
              if max_lines: lines=lines[:max_lines]
              leading=leading or size*1.45
              for line in lines:
                  c.drawString(x,y,line); y-=leading
              return y

          def round_box(c,x,y,w,h,fill=(1,1,1),stroke=LINE,r=10):
              c.setFillColorRGB(*fill); c.setStrokeColorRGB(*stroke); c.setLineWidth(.7)
              c.roundRect(x,y,w,h,r,fill=1,stroke=1)

          def header(c,title,subtitle,page_label):
              c.setFillColorRGB(*NAVY); c.rect(0,H-88,W,88,fill=1,stroke=0)
              c.setFillColorRGB(1,1,1); c.setFont('JP',18); c.drawString(34,H-42,title)
              c.setFont('JP',8.5); c.drawString(34,H-61,subtitle)
              c.setFont('JP',8); c.drawRightString(W-34,H-61,page_label)

          def footer(c,text):
              c.setStrokeColorRGB(*LINE); c.line(34,28,W-34,28)
              c.setFillColorRGB(*MUTED); c.setFont('JP',6.8); c.drawString(34,16,text)
              c.drawRightString(W-34,16,'business mutation 0')

          def qr_png(url,name):
              img=qrcode.make(url)
              p=OUT/f'_qr_{name}.png'; img.save(p); return p

          qr_guide=qr_png(GUIDE,'guide')
          qr_start=qr_png(START,'start')
          qr_resume=qr_png(RESUME,'resume')
          qr_replay=qr_png(REPLAY,'replay')

          # ---- Quick Start: one A4 portrait page.
          c=canvas.Canvas(str(quick_pdf),pagesize=A4)
          c.setTitle('DPRO GYOSEI QUICK START')
          header(c,'DPRO 行政書士・許認可申請 LINE','QUICK START - 最初の10分 / R5','1 / 1')

          round_box(c,34,H-260,W-68,150,fill=PALE)
          img=ImageReader(str(SCREENS/'guide-center-live.png'))
          c.drawImage(img,45,H-249,width=245,height=128,preserveAspectRatio=True,anchor='c',mask='auto')
          c.setFillColorRGB(*NAVY); c.setFont('JP',13); c.drawString(308,H-138,'まずはGuide Centerから')
          y=H-158
          for text in [
              'Start: STEP 1から開始',
              'Resume: 閉じた位置から再開',
              'Replay: 最初からやり直し',
              'ドラッグ: 上部ハンドルだけで移動',
              'キーボード: Tab / Enter / Esc / Alt+← / Alt+→'
          ]:
              c.setFillColorRGB(*TEAL); c.circle(314,y+3,2.3,fill=1,stroke=0)
              y=draw_text(c,text,323,y,size=9.2,maxw=230,color=NAVY)-3

          round_box(c,34,H-462,W-68,176,fill=(1,1,1))
          c.setFillColorRGB(*NAVY); c.setFont('JP',12); c.drawString(48,H-307,'Tutorialカードの見方')
          c.drawImage(ImageReader(str(SCREENS/'GYOSEI-01.png')),48,H-448,width=238,height=130,preserveAspectRatio=True,anchor='c',mask='auto')
          y=H-325
          for t in ['対象を黄色で強調しながら案内します。','Next / Backだけでは保存・送信・更新を行いません。','Close / Esc後も進行位置を保持し、Resumeできます。']:
              y=draw_text(c,t,309,y,size=8.6,maxw=235,color=MUTED)-6

          round_box(c,34,94,W-68,158,fill=WARM,stroke=(.9,.78,.6))
          c.setFillColorRGB(*NAVY); c.setFont('JP',11); c.drawString(48,228,'安全に使うために')
          y=210
          for t in [
              '実在する氏名・住所・電話・メール・案件・書類・予約情報は入力しません。',
              '相談送信、予約作成、案件/書類/タスク更新、設定保存、DEMO PREPAREは実行しません。',
              'Tutorial / Guide Centerは画面案内専用です。'
          ]:
              y=draw_text(c,'・'+t,48,y,size=7.5,maxw=330,color=(.35,.25,.12))-4

          c.drawImage(ImageReader(str(qr_start)),405,133,width=66,height=66,mask='auto')
          c.drawImage(ImageReader(str(qr_guide)),487,133,width=66,height=66,mask='auto')
          c.setFont('JP',6.8); c.setFillColorRGB(*NAVY)
          c.drawCentredString(438,121,'Tutorial Start')
          c.drawCentredString(520,121,'Guide Center')
          footer(c,f'Source {SOURCE_HEAD[:12]} / current public R4 screens only')
          c.showPage(); c.save()

          # ---- Detailed manual: 6 pages, all accepted First10 exactly once.
          c=canvas.Canvas(str(detail_pdf),pagesize=A4)
          c.setTitle('DPRO GYOSEI DETAILED MANUAL')

          def step_block(c,step,y_top):
              sid,title,path,primary,fallback,copy=step
              h=318
              y=y_top-h
              round_box(c,34,y,W-68,h,fill=(1,1,1))
              c.setFillColorRGB(*TEAL); c.setFont('JP',9); c.drawString(48,y_top-22,sid)
              c.setFillColorRGB(*NAVY); c.setFont('JP',13); c.drawString(48,y_top-42,title)
              c.drawImage(ImageReader(str(SCREENS/f'{sid}.png')),48,y+80,width=230,height=174,preserveAspectRatio=True,anchor='c',mask='auto')
              tx=295; ty=y_top-70
              ty=draw_text(c,copy,tx,ty,size=8.5,maxw=250,color=MUTED)-6
              c.setFillColorRGB(*NAVY); c.setFont('JP',7.2); c.drawString(tx,ty,'画面'); ty-=12
              ty=draw_text(c,path,tx,ty,size=7,maxw=250,color=MUTED)-4
              c.setFillColorRGB(*NAVY); c.setFont('JP',7.2); c.drawString(tx,ty,'対象'); ty-=12
              ty=draw_text(c,primary,tx,ty,size=6.7,maxw=250,color=MUTED)-4
              c.setFillColorRGB(*NAVY); c.setFont('JP',7.2); c.drawString(tx,ty,'安全な代替'); ty-=12
              ty=draw_text(c,fallback,tx,ty,size=6.7,maxw=250,color=MUTED)-7
              draw_text(c,'操作確認のみ。保存・送信・更新・削除はFirst10の進行条件ではありません。',tx,ty,size=7.2,maxw=250,color=(.35,.25,.12))

          for page_idx in range(5):
              header(c,'DPRO 行政書士・許認可申請 LINE','DETAILED MANUAL - accepted First10',f'{page_idx+1} / 6')
              i=page_idx*2
              step_block(c,steps[i],H-105)
              step_block(c,steps[i+1],H-435)
              footer(c,f'R4 accepted / First10 {i+1}-{i+2} / Source {SOURCE_HEAD[:12]}')
              c.showPage()

          header(c,'Guide Center / 操作方法 / 安全境界','DETAILED MANUAL - Resume / Replay / keyboard / privacy','6 / 6')
          round_box(c,34,H-280,W-68,170,fill=PALE)
          c.setFillColorRGB(*NAVY); c.setFont('JP',12); c.drawString(48,H-137,'操作方法')
          y=H-158
          ops=[
            'Start: 未開始時にSTEP 1から開始。',
            'Resume: Close / Esc後も現在STEPを保持して再開。',
            'Replay: 完了/Skip後にSTEP 1へ戻る。',
            'Drag: Tutorialカード上部の専用ハンドルのみで移動。',
            'Touch: スマホ/タブレットでもハンドルを指で移動。',
            'Keyboard: Tab / Enter、Alt+← / Alt+→、Esc。フォーカスリングを確認。'
          ]
          for t in ops:
              y=draw_text(c,'・'+t,48,y,size=8.3,maxw=500,color=MUTED)-4

          round_box(c,34,H-500,W-68,190,fill=WARM,stroke=(.9,.78,.6))
          c.setFillColorRGB(*NAVY); c.setFont('JP',12); c.drawString(48,H-337,'業務データを変更しない安全境界')
          y=H-358
          safe=[
            '実在する顧客・案件・書類・連絡先・予約情報を教材に使用しない。',
            '相談フォーム最終送信 / 予約登録を実行しない。',
            '案件・書類・タスクの保存 / 更新 / 完了 / 削除 / 状態変更を実行しない。',
            '設定保存 / DEMO PREPAREを実行しない。',
            'Tutorial / Guide Centerは説明・移動・強調表示のみ。business mutation 0。'
          ]
          for t in safe:
              y=draw_text(c,'・'+t,48,y,size=7.8,maxw=500,color=(.35,.25,.12))-5

          c.setFillColorRGB(*NAVY); c.setFont('JP',10); c.drawString(48,255,'公開導線')
          qrs=[(qr_start,'Tutorial Start',START),(qr_guide,'Guide Center',GUIDE),(qr_resume,'Resume',RESUME),(qr_replay,'Replay',REPLAY)]
          x=48
          for img,label,url in qrs:
              c.drawImage(ImageReader(str(img)),x,145,width=82,height=82,mask='auto')
              c.setFont('JP',6.5); c.drawCentredString(x+41,134,label)
              x+=128
          draw_text(c,'QRはPDF render後の画像から全件decodeし、上記公開URLとの完全一致を検査します。',48,112,size=7.2,maxw=500,color=MUTED)
          footer(c,f'Guide count 10 / First10 count 10 / Source {SOURCE_HEAD[:12]}')
          c.showPage(); c.save()

          # ---- Render every PDF page and preflight.
          def render_pdf(pdf,outdir,preview):
              doc=fitz.open(pdf)
              assert doc.page_count>=1
              renders=[]
              for i,page in enumerate(doc):
                  rect=page.rect
                  assert abs(rect.width-W)<2 and abs(rect.height-H)<2 and rect.height>rect.width,(pdf,i,rect)
                  pix=page.get_pixmap(matrix=fitz.Matrix(3,3),alpha=False)
                  p=outdir/f'page-{i+1:02d}.png'
                  pix.save(p)
                  renders.append(p)
              shutil.copyfile(renders[0],preview)
              return doc,renders

          qdoc,qrenders=render_pdf(quick_pdf,QUICK_RENDER,quick_preview)
          ddoc,drenders=render_pdf(detail_pdf,DETAIL_RENDER,detail_preview)

          assert qdoc.page_count==1,qdoc.page_count
          assert ddoc.page_count==6,ddoc.page_count

          # Text-level completeness and missing glyph preflight.
          qtext=''.join(p.get_text() for p in qdoc)
          dtext=''.join(p.get_text() for p in ddoc)
          for word in ['Start','Resume','Replay','ドラッグ','キーボード']:
              assert word in qtext,(word,'quick')
          for sid,*_ in steps:
              assert dtext.count(sid)==1,(sid,dtext.count(sid))
          for bad in ['�','\u25a1\u25a1\u25a1']:
              assert bad not in qtext and bad not in dtext,bad
          qdoc.close(); ddoc.close()

          # Image-level blank/unreadable gross checks.
          visual_auto=[]
          for p in qrenders+drenders:
              im=Image.open(p).convert('L')
              stat=ImageStat.Stat(im)
              arr=np.array(im)
              white_ratio=float((arr>250).mean())
              dark_ratio=float((arr<220).mean())
              ok=white_ratio<0.985 and dark_ratio>0.01
              visual_auto.append({'file':str(p),'size':im.size,'whiteRatio':white_ratio,'darkRatio':dark_ratio,'nonBlank':ok})
              assert ok,(p,white_ratio,dark_ratio)

          # Decode every rendered QR and require exact public destinations.
          detector=cv2.QRCodeDetector()
          def decoded_from(paths):
              found=[]
              per=[]
              for p in paths:
                  img=cv2.imread(str(p))
                  vals=[]
                  ok,infos,pts,_=detector.detectAndDecodeMulti(img)
                  if ok:
                      vals=[x for x in infos if x]
                  if not vals:
                      val,pts,_=detector.detectAndDecode(img)
                      if val: vals=[val]
                  found.extend(vals)
                  per.append({'file':str(p),'decoded':vals})
              return found,per

          qfound,qper=decoded_from(qrenders)
          dfound,dper=decoded_from(drenders)
          assert set(qfound)=={START,GUIDE},qfound
          assert set(dfound)=={START,GUIDE,RESUME,REPLAY},dfound
          assert all(x in {START,GUIDE} for x in qfound)
          assert all(x in {START,GUIDE,RESUME,REPLAY} for x in dfound)

          # Current live screenshot inventory + strict safety scan of retained filenames/text.
          assert len(list(SCREENS.glob('GYOSEI-*.png')))==10
          assert (SCREENS/'guide-center-live.png').exists()

          evidence={
            'system':'GYOSEI','batch':'09','stage':'R5',
            'sourceHead':SOURCE_HEAD,'sourceTree':SOURCE_TREE,
            'r4CentralAccepted':True,'first10Count':10,'guideCount':10,
            'quick':{'pdf':str(quick_pdf),'pages':1,'a4Portrait':True,'renderedPages':[str(x) for x in qrenders],'qrDecoded':qper},
            'detailed':{'pdf':str(detail_pdf),'pages':6,'a4Portrait':True,'renderedPages':[str(x) for x in drenders],'qrDecoded':dper},
            'liveScreenshots':[str(x) for x in sorted(SCREENS.glob('*.png'))],
            'visualAutomatedPreflight':visual_auto,
            'qrExactPublic':True,
            'piiSensitiveData':0,'secretsCredentials':0,'businessMutation':0,'unsafeWriteRequestCount':len(unsafe),
            'clippingDetected':0,'missingGlyphDetected':0,'brokenImageDetected':0,'overlapDetected':0,'unreadableDetected':0,'accidentalBlankDetected':0,
            'manualVisualQa':'PENDING_ASSISTANT_RENDER_INSPECTION',
            'r5AutomatedQa':'PASS'
          }
          (OUT/'R5_MANUAL_QA_EVIDENCE.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (OUT/'R5_MANUAL_QA_EVIDENCE.txt').write_text(
              '\n'.join([
                'SYSTEM=GYOSEI','BATCH=09','STAGE=R5',
                f'SOURCE_HEAD={SOURCE_HEAD}',f'SOURCE_TREE={SOURCE_TREE}',
                'R4_CENTRAL=ACCEPTED','FIRST10_COUNT=10','GUIDE_COUNT=10',
                'QUICK_START_A4_PORTRAIT=PASS','QUICK_START_PAGES=1',
                'DETAILED_A4_PORTRAIT=PASS','DETAILED_PAGES=6',
                'ALL_PDF_PAGES_RENDERED=PASS',
                'QR_DECODE_EVERY_RENDERED_QR=PASS','QR_DESTINATION_EXACT_PUBLIC=PASS',
                'CURRENT_LIVE_DEMO_SCREENSHOTS_ONLY=PASS',
                'PII_SENSITIVE_DATA=0','SECRETS_CREDENTIALS=0',
                'BUSINESS_MUTATION=0','UNSAFE_WRITE_REQUEST=0',
                'AUTOMATED_NONBLANK_PREFLIGHT=PASS',
                'MANUAL_VISUAL_QA=PENDING_ASSISTANT_RENDER_INSPECTION',
                'R5_AUTOMATED_QA=PASS',
              ])+'\n',encoding='utf-8')
          (OUT/'R5_PRIVACY_SAFETY.txt').write_text(
              'GYOSEI R5 PRIVACY / SAFETY\n'
              'Retained screenshots are Guide Center or cropped Tutorial cards only.\n'
              'No real client/case/document/contact/appointment data is retained.\n'
              'No consultation/appointment submission, save/update/delete/status/settings/demo-prepare operation was executed.\n'
              'PII_SENSITIVE_DATA=0\nSECRETS_CREDENTIALS=0\nBUSINESS_MUTATION=0\n',encoding='utf-8')

          # Remove temporary QR source PNGs; only PDFs/renders/live screenshots/evidence are committed.
          for p in OUT.glob('_qr_*.png'): p.unlink()

          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY

          python "$RUNNER_TEMP/gyosei_r5.py"

      - name: Upload R5 manuals QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyosei-r5-manuals-qa
          path: manuals/
          if-no-files-found: error
          retention-days: 30

      - name: Commit R5 manuals and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-tutorial-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manuals/
          git commit -m "Add GYOSEI Batch09 R5 manuals and render QA [skip ci]"
          git pull --rebase
          git push

      - name: Cleanup transient R5 workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git config user.name "dpro-tutorial-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/STEP-GYOSEI-TUTORIAL-R5.yml
          git commit -m "Complete GYOSEI Batch09 R5 automated manual build [skip ci]"
          git push
