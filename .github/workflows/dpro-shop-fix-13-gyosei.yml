name: "DPRO SHOP Fix 13 GYOSEI"
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/dpro-shop-fix-13-gyosei.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "dpro-shop-fix-13-gyosei"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited source SHA
        shell: bash
        run: |
          set -euo pipefail
          check() {
            path="$1"; expected="$2"
            test -f "$path" || { echo "Missing target: $path"; exit 31; }
            got="$(git hash-object "$path")"
            echo "$path  $got"
            test "$got" = "$expected" || { echo "SOURCE SHA MISMATCH: $path expected=$expected got=$got"; exit 32; }
          }
          check 'owner.html' 'd9a818fd1dcc9ca7496f21f6c29401b37993f3d7'

      - name: Apply narrow confirmed fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          
          def read(path):
              return Path(path).read_text(encoding="utf-8")
          
          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")
          
          def replace_once(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, found {n}")
              return text.replace(old,new,1)
          
          def sub_once(text, pattern, repl, label, flags=0):
              new,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {n}")
              return new
          
          p='owner.html'; t=read(p)
          needle='''      if(!changes.length)return toast("状態は変更されていません。");\n      showLoading(true,"状態を更新しています…");'''
          repl='''      if(!changes.length)return toast("状態は変更されていません。");\n      const guardedTargets=new Set(["accepted","declined","submitted","approved","rejected","withdrawn","completed","cancelled","renewed","expired"]);\n      const important=changes.filter(s=>guardedTargets.has(s.value));\n      if(important.length&&!confirm(`重要な案件状態を更新します。\\n${important.map(s=>`${s.dataset.statusGroup} → ${s.value}`).join("\\n")}\\n実行しますか？`))return;\n      showLoading(true,"状態を更新しています…");'''
          t=replace_once(t,needle,repl,'GYOSEI preflight guard')
          write(p,t)
          PY

      - name: Validate source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- "owner.html"
          if git diff --quiet -- "owner.html"; then
            echo "No source change was produced."
            exit 41
          fi

      - name: Commit fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "owner.html"
          git diff --cached --check
          git commit -m "Fix gyosei case status preflight guard"
          git push origin HEAD:main
