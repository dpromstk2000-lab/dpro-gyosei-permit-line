name: DPRO GYOSEI R3 Technical Exposure Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-GYOSEI-R3-TECHNICAL-EXPOSURE-FIX.yml'

permissions:
  contents: write

jobs:
  gyosei-r3-technical-exposure-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch system-check technical wording
        shell: python
        run: |
          from pathlib import Path
          p = Path("system-check.html")
          s = p.read_text(encoding="utf-8")
          old = "この画面は内部確認専用です。APIキー、Service Role Key、顧客の機密情報は表示しません。"
          new = "この画面は内部確認専用です。APIキーや機密認証情報、顧客の機密情報は表示しません。"
          assert old in s, "target technical wording not found"
          s = s.replace(old, new)
          assert "Service Role Key" not in s
          p.write_text(s, encoding="utf-8")

      - name: Commit public wording fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add system-check.html
          git commit -m "GYOSEI R3: remove technical exposure wording"
          git push origin HEAD:main
          echo "PATCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            curl -fsSL "https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/system-check.html?demo=1&r=${PATCH_HEAD}-${i}" -o /tmp/system-check-public.html || true
            if grep -Fq "APIキーや機密認証情報、顧客の機密情報は表示しません。" /tmp/system-check-public.html \
              && ! grep -Fq "Service Role Key" /tmp/system-check-public.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"

      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/gyosei-r3
          curl -fsSL "https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-gyosei-product-ready-gateway/api/health" \
            -o product-ready-evidence/gyosei-r3/health-final.json
          python - <<'PY'
          import json
          d=json.load(open("product-ready-evidence/gyosei-r3/health-final.json",encoding="utf-8"))
          assert d.get("ok") is True
          assert d.get("versions",{}).get("aligned") is True
          assert d.get("versions",{}).get("database") == "GYOSEI-R2-DB-PRODUCT-READY-20260824"
          assert d.get("versions",{}).get("frontend") == "GYOSEI-R2-FRONTEND-PRODUCT-READY-20260824"
          assert d.get("adapterVersion") == "GYOSEI-R2-ADAPTER-PRODUCT-READY-20260824"
          assert d.get("line",{}).get("verifiedSubAuthoritative") is True
          assert d.get("line",{}).get("clientSuppliedLineUserIdAuthoritative") is False
          assert d.get("line",{}).get("selfTest",{}).get("pass") is True
          assert d.get("booking",{}).get("slotMinutes") == 30
          assert d.get("booking",{}).get("pastServerGuard") is True
          assert d.get("booking",{}).get("businessCalendarServerGuard") is True
          print("HEALTH_JSON=PASS")
          PY

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gyosei-r3fix
          cd /tmp/gyosei-r3fix
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run fresh Chromium matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/gyosei-r3/screenshots
          cat > /tmp/gyosei-r3fix/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/';
          const cases=[
            {key:'pc1440-public',file:'index.html?demo=1',width:1440,height:1000},
            {key:'mobile390-public',file:'index.html?demo=1',width:390,height:844},
            {key:'mobile320-member',file:'member.html?demo=1',width:320,height:720},
            {key:'ipad1024-owner',file:'owner-ipad.html?demo=1',width:1024,height:768},
            {key:'pc1440-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'pc1440-system-check',file:'system-check.html?demo=1',width:1440,height:1000}
          ];

          const blocking=/(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;
          const technical=/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;

          const browser=await chromium.launch({headless:true});
          const results=[];
          let failed=false;

          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            const pageErrors=[], consoleErrors=[], httpErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{
              if(r.status()>=400) httpErrors.push({
                status:r.status(), url:r.url(), resourceType:r.request().resourceType()
              });
            });

            let status=0, navigationError='';
            try{
              const resp=await page.goto(
                BASE+c.file+(c.file.includes('?')?'&':'?')+'qa='+Date.now(),
                {waitUntil:'domcontentloaded',timeout:60000}
              );
              status=resp?.status()||0;
              await page.waitForTimeout(3500);
            }catch(e){
              navigationError=String(e);
            }

            const metrics=navigationError?null:await page.evaluate(()=>{
              const de=document.documentElement,b=document.body;
              return {
                innerWidth:window.innerWidth,
                documentScrollWidth:de?.scrollWidth||0,
                bodyScrollWidth:b?.scrollWidth||0,
                overflow:Math.max(de?.scrollWidth||0,b?.scrollWidth||0)>window.innerWidth+1,
                text:(b?.innerText||'').slice(0,250000)
              };
            });

            const blockingConsoleErrors=consoleErrors.filter(x=>blocking.test(x));
            const criticalResourceErrors=httpErrors.filter(
              x=>['document','script','stylesheet'].includes(x.resourceType)
            );
            const technicalExposure=metrics?technical.test(metrics.text):true;

            const record={
              ...c,
              url:BASE+c.file,
              httpStatus:status,
              navigationError,
              overflow:metrics?.overflow??true,
              innerWidth:metrics?.innerWidth??0,
              documentScrollWidth:metrics?.documentScrollWidth??0,
              bodyScrollWidth:metrics?.bodyScrollWidth??0,
              pageErrors,
              consoleErrors,
              blockingConsoleErrors,
              httpErrors,
              criticalResourceErrors,
              technicalExposure
            };
            record.ok=!navigationError && status===200 && !record.overflow &&
              pageErrors.length===0 && blockingConsoleErrors.length===0 &&
              criticalResourceErrors.length===0 && !technicalExposure;

            if(!record.ok) failed=true;
            results.push(record);

            if(!navigationError){
              await page.screenshot({
                path:`product-ready-evidence/gyosei-r3/screenshots/${c.key}.png`,
                fullPage:true
              });
            }
            await ctx.close();
          }

          await browser.close();

          const summary={
            ok:!failed,
            checkedAt:new Date().toISOString(),
            sourcePatchHead:process.env.PATCH_HEAD||null,
            frontendVersion:'GYOSEI-R2-FRONTEND-PRODUCT-READY-20260824',
            adapterVersion:'GYOSEI-R2-ADAPTER-PRODUCT-READY-20260824',
            databaseVersion:'GYOSEI-R2-DB-PRODUCT-READY-20260824',
            total:results.length,
            passed:results.filter(x=>x.ok).length,
            failed:results.filter(x=>!x.ok).length,
            results
          };

          fs.writeFileSync(
            'product-ready-evidence/gyosei-r3/browser-final.json',
            JSON.stringify(summary,null,2)+'\n'
          );
          fs.writeFileSync(
            'product-ready-evidence/gyosei-r3/technical-exposure-fix.json',
            JSON.stringify({
              ok: summary.ok,
              sourcePatchHead: summary.sourcePatchHead,
              checkedAt: summary.checkedAt,
              removedPhrase: 'Service Role Key',
              sixScreenPass: summary.passed===6 && summary.failed===0
            },null,2)+'\n'
          );

          console.log(JSON.stringify({
            ok:summary.ok,total:summary.total,passed:summary.passed,failed:summary.failed
          },null,2));

          process.exit(summary.ok?0:2);
          EOF

          PATCH_HEAD="$PATCH_HEAD" node /tmp/gyosei-r3fix/qa.mjs

      - name: Publish final evidence
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git add product-ready-evidence/gyosei-r3
          git commit -m "Publish GYOSEI R3 6-of-6 final evidence"
          git push origin HEAD:main
