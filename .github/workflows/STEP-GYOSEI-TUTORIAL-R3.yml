name: DPRO GYOSEI Batch09 Tutorial R3 LIVE QA

on:
  workflow_dispatch:
  push:
    paths:
      - 'tutorial.html'

permissions:
  contents: write

concurrency:
  group: dpro-gyosei-tutorial-r3
  cancel-in-progress: false

jobs:
  tutorial-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record forward-only source
        shell: bash
        run: |
          set -euo pipefail
          echo "QA_SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "QA_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          test -f tutorial.html
          grep -F 'GYOSEI-TUTORIAL-R3-V1.1-20260829' tutorial.html
          grep -F 'GYOSEI-10' tutorial.html
          if git grep -nE 'fetch\([^)]*method[[:space:]]*:[[:space:]]*["'\''](POST|PUT|PATCH|DELETE)|apiFetch\([^)]*\{[^}]*method[[:space:]]*:[[:space:]]*["'\''](POST|PUT|PATCH|DELETE)' -- tutorial.html; then
            echo "Unsafe write primitive found in tutorial.html"
            exit 1
          fi

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gyosei-tutorial-r3
          cd /tmp/gyosei-tutorial-r3
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages tutorial deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html"
          ok=0
          for i in $(seq 1 72); do
            if curl -fsSL --max-time 12 "$URL?deploy_probe=$GITHUB_SHA-$i" | grep -Fq 'GYOSEI-TUTORIAL-R3-V1.1-20260829'; then
              ok=1
              echo "Tutorial deployed on attempt $i"
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Run exact four-width Chromium LIVE QA
        id: liveqa
        shell: bash
        run: |
          set +e
          mkdir -p tutorial-evidence/gyosei-r3/screenshots
          cat > /tmp/gyosei-tutorial-r3/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/';
          const TUTORIAL=BASE+'tutorial.html';
          const expectedVersion='GYOSEI-TUTORIAL-R3-V1.1-20260829';
          const sizes=[
            {key:'pc1440',width:1440,height:1000},
            {key:'tablet1024',width:1024,height:768},
            {key:'mobile390',width:390,height:844},
            {key:'mobile320',width:320,height:720},
          ];
          const safeMethods=new Set(['GET','HEAD','OPTIONS']);
          const delay=(ms)=>new Promise(r=>setTimeout(r,ms));

          async function waitTutorial(page){
            await page.waitForFunction(v=>window.__DPRO_TUTORIAL__?.version===v,expectedVersion,{timeout:20000});
          }
          async function target(page,index){
            await page.waitForFunction(i=>{
              const t=window.__DPRO_TUTORIAL__;
              const s=t?.getState?.();
              const r=t?.getTargetState?.();
              return s?.status==='active' && s.index===i && r?.resolved===true && r.stepId===t.steps[i].id;
            },index,{timeout:20000});
            return await page.evaluate(()=>window.__DPRO_TUTORIAL__.getTargetState());
          }
          async function state(page){return await page.evaluate(()=>window.__DPRO_TUTORIAL__.getState())}
          async function next(page){await page.locator('#nextButton').click()}
          async function resetStorage(page){
            await page.evaluate(()=>{localStorage.clear();sessionStorage.clear()});
            await page.reload({waitUntil:'domcontentloaded'});
            await waitTutorial(page);
          }
          async function enterIpadCode(page){
            const frame=page.frameLocator('#productFrame');
            if(await frame.locator('nav.tabs').isVisible().catch(()=>false)) return 'already_authenticated';
            const input=frame.locator('#adminCode');
            if(await input.isVisible().catch(()=>false)){
              await input.fill('1234');
              return 'filled';
            }
            return 'auto_auth_in_progress';
          }
          async function ensureIpadReady(page,{keyboard=false}={}){
            const frame=page.frameLocator('#productFrame');
            const tabs=frame.locator('nav.tabs');
            if(await tabs.isVisible().catch(()=>false)) return 'already_authenticated';
            const loading=frame.locator('#loading');
            if(await loading.isVisible().catch(()=>false)){
              await Promise.race([
                tabs.waitFor({state:'visible',timeout:20000}).catch(()=>null),
                loading.waitFor({state:'hidden',timeout:20000}).catch(()=>null)
              ]);
            }
            if(await tabs.isVisible().catch(()=>false)) return 'auto_authenticated';
            const input=frame.locator('#adminCode');
            if(await input.isVisible().catch(()=>false)){
              if(!(await input.inputValue().catch(()=>''))) await input.fill('1234');
              const button=frame.locator('#loginForm .btn-primary');
              await frame.locator('#loading').waitFor({state:'hidden',timeout:20000}).catch(()=>{});
              if(keyboard){
                await button.focus();
                await page.keyboard.press('Enter');
              }else{
                await button.click();
              }
              await tabs.waitFor({state:'visible',timeout:20000});
              return keyboard ? 'keyboard_login' : 'pointer_login';
            }
            await tabs.waitFor({state:'visible',timeout:20000});
            return 'auto_authenticated_late';
          }
          async function ownerRecoverIfNeeded(page,resolution,{keyboard=false}={}){
            const frame=page.frameLocator('#productFrame');
            const title=frame.locator('#pageTitle');
            if(await title.isVisible().catch(()=>false)) return 'already_authenticated';
            if(!['fallback','recovery'].includes(resolution?.used)) return false;
            const loading=frame.locator('#loading');
            if(await loading.isVisible().catch(()=>false)){
              await Promise.race([
                title.waitFor({state:'visible',timeout:20000}).catch(()=>null),
                loading.waitFor({state:'hidden',timeout:20000}).catch(()=>null)
              ]);
            }
            if(await title.isVisible().catch(()=>false)) return 'auto_authenticated';
            const input=frame.locator('#adminCodeInput');
            if(await input.isVisible().catch(()=>false)){
              await input.fill('1234');
              const button=frame.locator('#adminLoginForm .btn-primary');
              await frame.locator('#loading').waitFor({state:'hidden',timeout:20000}).catch(()=>{});
              if(keyboard){await button.focus();await page.keyboard.press('Enter');}
              else await button.click();
              await title.waitFor({state:'visible',timeout:20000});
              return keyboard ? 'keyboard_login' : 'pointer_login';
            }
            await title.waitFor({state:'visible',timeout:20000});
            return 'auto_authenticated_late';
          }
          function inside(rect,w,h){
            return rect.left>=7 && rect.top>=7 && rect.right<=w-7+0.5 && rect.bottom<=h-7+0.5;
          }

          const browser=await chromium.launch({headless:true});
          const report={
            ok:true,
            version:expectedVersion,
            checkedAt:new Date().toISOString(),
            sourceHead:process.env.GITHUB_SHA||'',
            first10Count:10,
            first10UniqueIds:10,
            businessMutation:0,
            unsafeWriteRequestCount:0,
            matrix:[]
          };

          for(const size of sizes){
            const context=await browser.newContext({viewport:{width:size.width,height:size.height}});
            const page=await context.newPage();
            const unsafe=[];
            const tutorialConsoleErrors=[];
            const tutorialPageErrors=[];
            page.on('request',req=>{
              if(!safeMethods.has(req.method())){
                unsafe.push({method:req.method(),url:req.url(),resourceType:req.resourceType()});
              }
            });
            page.on('console',msg=>{
              if(msg.type()==='error'){
                const loc=msg.location();
                if((loc?.url||'').includes('/tutorial.html')){
                  tutorialConsoleErrors.push({text:msg.text(),location:loc});
                }
              }
            });
            page.on('pageerror',err=>{
              const stack=String(err.stack||err.message||err);
              if(stack.includes('tutorial.html')) tutorialPageErrors.push(stack);
            });

            const url=TUTORIAL+'?qa='+encodeURIComponent(process.env.GITHUB_SHA||Date.now())+'&w='+size.width;
            const nav=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await waitTutorial(page);

            const meta=await page.evaluate(()=>({
              count:window.__DPRO_TUTORIAL__.count,
              ids:window.__DPRO_TUTORIAL__.steps.map(x=>x.id),
              innerWidth:window.innerWidth,
              docWidth:document.documentElement.scrollWidth,
              bodyWidth:document.body.scrollWidth
            }));
            const uniqueIds=new Set(meta.ids).size;
            const overflow=(meta.docWidth>meta.innerWidth)||(meta.bodyWidth>meta.innerWidth);
            const row={
              key:size.key,width:size.width,height:size.height,httpStatus:nav?.status()||0,
              innerWidth:meta.innerWidth,documentScrollWidth:meta.docWidth,bodyScrollWidth:meta.bodyWidth,
              overflow,first10Count:meta.count,uniqueIds,
              controls:{},drag:{},steps:[],keyboardOnly:false,
              crossPageResume:false,focusVisibleRecoverable:false,
              tutorialConsoleErrors,tutorialPageErrors,unsafeWriteRequests:unsafe
            };

            if(meta.count!==10 || uniqueIds!==10 || overflow) row.ok=false;

            // START + step 1
            await page.locator('#startButton').click();
            row.steps.push({step:1,...await target(page,0)});

            // NEXT / BACK
            await next(page);
            await target(page,1);
            await page.locator('#backButton').click();
            await target(page,0);
            row.controls.nextBack=(await state(page)).index===0;

            // CLOSE / RESUME
            await page.locator('#closeButton').click();
            const closeHidden=await page.locator('#tutorialCard').evaluate(el=>el.classList.contains('hidden'));
            const resumeVisible=await page.locator('#resumeButton').isVisible();
            await page.locator('#resumeButton').click();
            await target(page,0);
            row.controls.close=closeHidden;
            row.controls.resume=resumeVisible && (await state(page)).index===0;

            // ESC / RESUME same step
            await page.keyboard.press('Escape');
            const escHidden=await page.locator('#tutorialCard').evaluate(el=>el.classList.contains('hidden'));
            await page.locator('#resumeButton').click();
            await target(page,0);
            row.controls.esc=escHidden && (await state(page)).index===0;

            // SKIP / REPLAY
            await page.locator('#skipButton').click();
            const skipped=(await state(page)).status==='complete';
            const replayVisible=await page.locator('#replayButton').isVisible();
            await page.locator('#replayButton').click();
            await target(page,0);
            row.controls.skip=skipped;
            row.controls.replay=replayVisible && (await state(page)).index===0;

            // MOUSE POINTER DRAG
            const before=await page.evaluate(()=>window.__DPRO_TUTORIAL__.cardRect());
            const hb=await page.locator('#dragHandle').boundingBox();
            await page.mouse.move(hb.x+24,hb.y+24);
            await page.mouse.down();
            await page.mouse.move(Math.min(size.width-30,hb.x+170),Math.min(size.height-30,hb.y+150),{steps:8});
            await page.mouse.up();
            const after=await page.evaluate(()=>window.__DPRO_TUTORIAL__.cardRect());
            row.drag.mousePointer=(Math.abs(after.left-before.left)>2 || Math.abs(after.top-before.top)>2) && inside(after,size.width,size.height);

            // TOUCH POINTER DRAG + CLAMP
            const touchBefore=await page.evaluate(()=>window.__DPRO_TUTORIAL__.cardRect());
            await page.evaluate(()=>{
              const h=document.querySelector('#dragHandle');
              const r=h.getBoundingClientRect();
              h.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:77,pointerType:'touch',button:0,clientX:r.left+25,clientY:r.top+25}));
              window.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId:77,pointerType:'touch',button:0,clientX:window.innerWidth+900,clientY:window.innerHeight+900}));
              window.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:77,pointerType:'touch',button:0,clientX:window.innerWidth+900,clientY:window.innerHeight+900}));
            });
            const touchAfter=await page.evaluate(()=>window.__DPRO_TUTORIAL__.cardRect());
            row.drag.touchPointer=(Math.abs(touchAfter.left-touchBefore.left)>2 || Math.abs(touchAfter.top-touchBefore.top)>2);
            row.drag.viewportClamp=inside(touchAfter,size.width,size.height);

            // Full authoritative First10 resolution.
            await resetStorage(page);
            await page.locator('#startButton').click();
            let previousPath='';
            for(let i=0;i<10;i++){
              const r=await target(page,i);
              const spec=await page.evaluate(i=>window.__DPRO_TUTORIAL__.steps[i],i);
              const active=await page.evaluate(()=>document.activeElement===document.querySelector('#productFrame'));
              row.steps[i]={step:i+1,id:spec.id,path:spec.path,primary:spec.primary,fallback:spec.fallback,...r,frameFocused:active};
              if(i===5){
                await enterIpadCode(page);
              }
              if(i===6){
                row.steps[i].ipadReady=await ensureIpadReady(page);
              }
              if(i===8){
                const recovered=await ownerRecoverIfNeeded(page,r);
                row.steps[i].ownerRecovery=recovered;
              }
              if(i<9){
                previousPath=spec.path;
                await next(page);
              }
            }
            row.crossPageResume=true;
            // Close on step10 then Resume must stay step10.
            await page.locator('#closeButton').click();
            await page.locator('#resumeButton').click();
            await target(page,9);
            row.crossPageResume=(await state(page)).index===9;

            // Complete, Replay -> step 1.
            await page.locator('#nextButton').click();
            const completed=(await state(page)).status==='complete';
            await page.locator('#replayButton').click();
            await target(page,0);
            row.controls.completeReplay=completed && (await state(page)).index===0;

            // KEYBOARD-ONLY full completion in fresh state.
            await resetStorage(page);
            await page.locator('#startButton').focus();
            await page.keyboard.press('Enter');
            await target(page,0);
            for(let i=0;i<10;i++){
              if(i===5){
                const frame=page.frameLocator('#productFrame');
                const input=frame.locator('#adminCode');
                if(await input.isVisible().catch(()=>false)){
                  await input.focus();
                  await page.keyboard.press('Control+A').catch(()=>{});
                  await page.keyboard.type('1234');
                }
              }
              if(i===6){
                await ensureIpadReady(page,{keyboard:true});
              }
              if(i===8){
                const r=await page.evaluate(()=>window.__DPRO_TUTORIAL__.getTargetState());
                await ownerRecoverIfNeeded(page,r,{keyboard:true});
              }
              if(i<9){
                await page.keyboard.press('Alt+ArrowRight');
                await target(page,i+1);
              }else{
                await page.keyboard.press('Alt+ArrowRight');
              }
            }
            await page.waitForFunction(()=>window.__DPRO_TUTORIAL__.getState().status==='complete',{timeout:10000});
            row.keyboardOnly=true;

            // Focus/recovery: after replay step1 target is focusable/highlighted or card controls recover via close/resume.
            await page.locator('#replayButton').click();
            const focusTarget=await target(page,0);
            await page.keyboard.press('Escape');
            const recover=await page.locator('#resumeButton').isVisible();
            row.focusVisibleRecoverable=!!focusTarget.resolved && recover;

            await page.screenshot({path:`tutorial-evidence/gyosei-r3/screenshots/${size.key}.png`,fullPage:true});
            row.unsafeWriteRequests=unsafe.slice();
            row.tutorialConsoleErrors=tutorialConsoleErrors.slice();
            row.tutorialPageErrors=tutorialPageErrors.slice();

            row.ok = row.ok!==false &&
              row.httpStatus===200 &&
              row.first10Count===10 && row.uniqueIds===10 &&
              !row.overflow &&
              row.controls.nextBack && row.controls.close && row.controls.esc &&
              row.controls.skip && row.controls.resume && row.controls.replay && row.controls.completeReplay &&
              row.drag.mousePointer && row.drag.touchPointer && row.drag.viewportClamp &&
              row.keyboardOnly && row.focusVisibleRecoverable && row.crossPageResume &&
              row.steps.length===10 && row.steps.every(s=>s.resolved===true) &&
              tutorialConsoleErrors.length===0 && tutorialPageErrors.length===0 &&
              unsafe.length===0;

            report.matrix.push(row);
            report.unsafeWriteRequestCount += unsafe.length;
            await context.close();
          }

          report.ok=report.matrix.every(x=>x.ok===true) &&
                    report.unsafeWriteRequestCount===0 &&
                    report.first10Count===10 &&
                    report.businessMutation===0;

          fs.writeFileSync('tutorial-evidence/gyosei-r3/r3-live-qa.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(!report.ok) process.exit(2);
          EOF

          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/gyosei-tutorial-r3/node_modules GITHUB_SHA="$GITHUB_SHA" node /tmp/gyosei-tutorial-r3/qa.mjs
          qa_exit=$?
          echo "qa_exit=$qa_exit" >> "$GITHUB_OUTPUT"
          echo "QA_EXIT=$qa_exit" >> "$GITHUB_ENV"
          exit 0

      - name: Publish R3 QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/gyosei-r3
          cat > tutorial-evidence/gyosei-r3/source-lock.txt <<EOF
          SYSTEM=GYOSEI
          BATCH=09
          STAGE=R3
          SOURCE_HEAD=$QA_SOURCE_HEAD
          SOURCE_TREE=$QA_SOURCE_TREE
          WORKFLOW_SHA=$GITHUB_SHA
          FORWARD_ONLY=PASS
          BUSINESS_MUTATION=0
          R4=NOT_STARTED_AT_R3_QA
          R5=NOT_AUTHORIZED
          R6=NOT_AUTHORIZED
          R7=NOT_AUTHORIZED
          EOF
          git config user.name "dpro-tutorial-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tutorial-evidence/gyosei-r3
          if ! git diff --cached --quiet; then
            git commit -m "Publish GYOSEI Batch09 R3 tutorial QA evidence [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Enforce R3 full PASS
        shell: bash
        run: |
          set -euo pipefail
          test "${QA_EXIT:-99}" = "0"
          test -f tutorial-evidence/gyosei-r3/r3-live-qa.json
          python - <<'PY'
          import json
          p='tutorial-evidence/gyosei-r3/r3-live-qa.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['ok'] is True
          assert d['first10Count']==10
          assert d['businessMutation']==0
          assert d['unsafeWriteRequestCount']==0
          assert len(d['matrix'])==4
          assert all(x['ok'] is True for x in d['matrix'])
          print('R3 FULL PASS')
          PY

      - name: PASS cleanup workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git config user.name "dpro-tutorial-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/STEP-GYOSEI-TUTORIAL-R3.yml
          git commit -m "Complete GYOSEI Batch09 R3 tutorial LIVE QA [skip ci]"
          git push
