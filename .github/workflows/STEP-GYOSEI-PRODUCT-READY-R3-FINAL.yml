name: DPRO GYOSEI Product Ready R3 Final Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-GYOSEI-PRODUCT-READY-R3-FINAL.yml'

permissions:
  contents: write

jobs:
  gyosei-r3-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current source
        shell: bash
        run: |
          set -euo pipefail
          echo "CURRENT_HEAD=$(git rev-parse HEAD)"
          echo "R1_SOURCE_LOCK=9c0f46f0675e38d722dc29df85da79546218564e"
          test -f config.js
          test -f index.html
          test -f member.html
          test -f owner.html
          test -f owner-ipad.html
          test -f system-check.html
          grep -F 'GYOSEI-4-CONFIG-PUBLIC-BASE-20260716' config.js || grep -F 'GYOSEI-R2-FRONTEND-PRODUCT-READY-20260824' config.js

      - name: Apply authoritative R2 frontend
        shell: python
        run: |
          import base64
          from pathlib import Path

          Path("config.js").write_bytes(base64.b64decode(""))

          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          old = "duration_minutes:60"
          new = "duration_minutes:30"

          if old in text:
              count = text.count(old)
              p.write_text(text.replace(old, new), encoding="utf-8")
              print({"replaced": count})
          elif new in text:
              print("30-minute patch already present")
          else:
              raise SystemExit("booking duration marker not found")

          verify = p.read_text(encoding="utf-8")
          assert old not in verify
          assert new in verify

      - name: Verify patched frontend
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'GYOSEI-R2-FRONTEND-PRODUCT-READY-20260824' config.js
          grep -F 'https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-gyosei-product-ready-gateway' config.js
          grep -F 'X-Line-Id-Token' config.js
          ! grep -F 'headers.set("X-Line-User-Id"' config.js
          grep -F 'duration_minutes:30' index.html
          ! grep -F 'duration_minutes:60' index.html
          echo "FRONTEND_PATCH_VERIFY=PASS"

      - name: Commit R3 frontend patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config.js index.html
          if git diff --cached --quiet; then
            echo "R3 frontend patch already current."
          else
            git commit -m "GYOSEI R3: bind Product READY gateway and 30-minute booking"
            git push
          fi
          echo "PATCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line'
          EXPECT='GYOSEI-R2-FRONTEND-PRODUCT-READY-20260824'
          ok=0
          for i in $(seq 1 36); do
            status="$(curl -sS -o /tmp/gyosei-config.js -w '%{http_code}' "${BASE}/config.js?r3=${GITHUB_RUN_ID}-${i}" || true)"
            if [ "$status" = "200" ] && grep -Fq "$EXPECT" /tmp/gyosei-config.js; then
              if curl -fsSL "${BASE}/index.html?r3=${GITHUB_RUN_ID}-${i}" | grep -Fq 'duration_minutes:30'; then
                ok=1
                echo "PAGES_PROPAGATION=PASS attempt=$i"
                break
              fi
            fi
            sleep 10
          done
          [ "$ok" = "1" ] || exit 1

      - name: Verify Product READY health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-gyosei-product-ready-gateway/api/health'
          ok=0
          for i in $(seq 1 18); do
            status="$(curl -sS -o /tmp/health.json -w '%{http_code}' "${URL}?r3=${GITHUB_RUN_ID}-${i}" || true)"
            if [ "$status" = "200" ]; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert d.get('ok') is True
          assert d.get('systemCode') == 'GYOSEI'
          assert d.get('versions',{}).get('aligned') is True
          assert d.get('versions',{}).get('database') == 'GYOSEI-R2-DB-PRODUCT-READY-20260824'
          assert d.get('versions',{}).get('frontend') == 'GYOSEI-R2-FRONTEND-PRODUCT-READY-20260824'
          assert d.get('adapterVersion') == 'GYOSEI-R2-ADAPTER-PRODUCT-READY-20260824'
          assert d.get('line',{}).get('verifiedSubAuthoritative') is True
          assert d.get('line',{}).get('clientSuppliedLineUserIdAuthoritative') is False
          assert d.get('line',{}).get('selfTest',{}).get('pass') is True
          assert d.get('booking',{}).get('slotMinutes') == 30
          assert d.get('booking',{}).get('pastServerGuard') is True
          assert d.get('booking',{}).get('businessCalendarServerGuard') is True
          print('HEALTH_JSON=PASS')
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          [ "$ok" = "1" ] || { cat /tmp/health.json || true; exit 1; }

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gyosei-r3
          cd /tmp/gyosei-r3
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run fresh Chromium matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/gyosei-r3/screenshots
          cat > /tmp/gyosei-r3/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/';
          const cases=[
            {key:'pc1440-public',file:'index.html?demo=1',width:1440,height:1000},
            {key:'mobile390-public',file:'index.html?demo=1',width:390,height:844},
            {key:'mobile320-member',file:'member.html?demo=1',width:320,height:720},
            {key:'ipad1024-owner',file:'owner-ipad.html?demo=1',width:1024,height:768},
            {key:'pc1440-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'pc1440-system-check',file:'system-check.html?demo=1',width:1440,height:1000}
          ];
          const blocking=/(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;
          const technical=/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;

          const browser=await chromium.launch({headless:true});
          const results=[];
          let failed=false;

          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            const pageErrors=[], consoleErrors=[], httpErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()})});

            let status=0, navigationError='';
            try{
              const resp=await page.goto(BASE+c.file+(c.file.includes('?')?'&':'?')+'qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              status=resp?.status()||0;
              await page.waitForTimeout(3500);
            }catch(e){navigationError=String(e)}

            const metrics=navigationError?null:await page.evaluate(()=>{
              const de=document.documentElement,b=document.body;
              return {
                innerWidth:window.innerWidth,
                documentScrollWidth:de?.scrollWidth||0,
                bodyScrollWidth:b?.scrollWidth||0,
                overflow:Math.max(de?.scrollWidth||0,b?.scrollWidth||0)>window.innerWidth+1,
                text:(b?.innerText||'').slice(0,250000)
              };
            });

            const blockingConsoleErrors=consoleErrors.filter(x=>blocking.test(x));
            const criticalResourceErrors=httpErrors.filter(x=>['document','script','stylesheet'].includes(x.resourceType));
            const technicalExposure=metrics?technical.test(metrics.text):true;

            const record={...c,url:BASE+c.file,httpStatus:status,navigationError,
              overflow:metrics?.overflow??true,innerWidth:metrics?.innerWidth??0,
              documentScrollWidth:metrics?.documentScrollWidth??0,bodyScrollWidth:metrics?.bodyScrollWidth??0,
              pageErrors,consoleErrors,blockingConsoleErrors,httpErrors,criticalResourceErrors,technicalExposure};
            record.ok=!navigationError&&status===200&&!record.overflow&&pageErrors.length===0&&blockingConsoleErrors.length===0&&criticalResourceErrors.length===0&&!technicalExposure;
            if(!record.ok)failed=true;
            results.push(record);
            if(!navigationError)await page.screenshot({path:`product-ready-evidence/gyosei-r3/screenshots/${c.key}.png`,fullPage:true});
            await ctx.close();
          }

          await browser.close();
          const summary={ok:!failed,checkedAt:new Date().toISOString(),sourcePatchHead:process.env.PATCH_HEAD||null,
            frontendVersion:'GYOSEI-R2-FRONTEND-PRODUCT-READY-20260824',
            adapterVersion:'GYOSEI-R2-ADAPTER-PRODUCT-READY-20260824',
            databaseVersion:'GYOSEI-R2-DB-PRODUCT-READY-20260824',
            total:results.length,passed:results.filter(x=>x.ok).length,failed:results.filter(x=>!x.ok).length,results};
          fs.writeFileSync('product-ready-evidence/gyosei-r3/browser-final.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify({ok:summary.ok,total:summary.total,passed:summary.passed,failed:summary.failed},null,2));
          process.exit(summary.ok?0:2);
          EOF

          set +e
          node /tmp/gyosei-r3/qa.mjs
          rc=$?
          set -e
          echo "QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Save final evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f product-ready-evidence/gyosei-r3/browser-final.json
          cp /tmp/health.json product-ready-evidence/gyosei-r3/health-final.json
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-ready-evidence/gyosei-r3
          if ! git diff --cached --quiet; then
            git commit -m "Publish GYOSEI R3 Product READY evidence"
          fi
          git pull --rebase
          git push

      - name: PASS cleanup
        if: env.QA_EXIT == '0'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/STEP-GYOSEI-PRODUCT-READY-R3-FINAL.yml
          git commit -m "Complete GYOSEI Product READY R3 final gate"
          git push

      - name: FAIL preserve evidence
        if: env.QA_EXIT != '0'
        shell: bash
        run: |
          echo "GYOSEI R3 still has a blocking browser failure."
          echo "Evidence is preserved under product-ready-evidence/gyosei-r3/."
          exit 1
